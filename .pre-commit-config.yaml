repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: detect-private-key
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.2
    hooks:
      - id: ruff-check
  - repo: local
    hooks:
      # Belt and braces on top of .gitignore: never commit credentials or data.
      - id: block-credentials-and-data
        name: block kaggle.json, .kaggle/ and data/
        entry: credentials or data files must never be committed
        language: fail
        # kaggle.json / .kaggle anywhere; data/ only at the repo root (src/churnlens/data is code).
        files: '((^|/)(kaggle\.json|\.kaggle/)|^data/)'
