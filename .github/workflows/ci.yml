name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests app
      - name: Test
        # Data-dependent tests (leakage on built files, agents on outputs, app pages)
        # skip automatically when pipeline outputs are absent; unit tests always run.
        run: pytest -q
