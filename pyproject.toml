[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "churnlens"
version = "0.1.0"
description = "Customer churn prediction and retention intelligence on KKBox data"
requires-python = ">=3.11,<3.12"
# Later phases add their own dependencies (modeling, app, agents) when they land.
dependencies = [
    "pyarrow>=15",
    "pyyaml>=6",
    "py7zr>=1.0",
    "kaggle>=1.6",
    "duckdb>=1.1",
    "pandas>=2.2",
    "pandera>=0.20",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "lifelines>=0.27",
    "scikit-learn>=1.4",
    "lightgbm>=4.0",
    "mlflow>=2.10",
    "joblib>=1.3",
    "shap>=0.45",
    "anthropic>=0.40",
    "mcp>=2.0",
    "streamlit>=1.40",
    "plotly>=5.20",
    "evidently>=0.7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "pre-commit>=3.7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
