# Phase 6 modeling. Train, tune, calibrate and pick the threshold on snapshot A;
# evaluate once on snapshot B (out-of-time test).

train_snapshot: A
test_snapshot: B
seed: 42

cv:
  folds: 5                 # stratified, shuffled with `seed`
  scoring: average_precision   # PR-AUC: suited to a 6% positive class

# One-hot encoding: categories rarer than this share of training rows fold into
# "infrequent"; unseen categories at test time map there too.
onehot_min_frequency: 0.005

# Imbalance: class weights (inverse frequency). SMOTE is not used: see decisions #41.
class_weight: balanced

models:
  logreg:
    n_iter: 8
    params:
      clf__C: {log_uniform: [0.001, 10.0]}
  random_forest:
    n_iter: 6
    fixed: {n_estimators: 300, n_jobs: -1}
    params:
      clf__max_depth: {choice: [8, 12, 16, 24]}
      clf__min_samples_leaf: {choice: [5, 20, 50, 100]}
      clf__max_features: {choice: [0.1, 0.2, 0.4]}
  lightgbm:
    n_iter: 20
    fixed: {n_estimators: 400, n_jobs: 8, deterministic: true, force_row_wise: true,
            verbose: -1}
    params:
      clf__learning_rate: {log_uniform: [0.01, 0.2]}
      clf__num_leaves: {choice: [15, 31, 63, 127]}
      clf__min_child_samples: {choice: [20, 50, 100, 200]}
      clf__subsample: {choice: [0.7, 0.85, 1.0]}
      clf__subsample_freq: {choice: [1]}
      clf__colsample_bytree: {choice: [0.5, 0.7, 0.9]}
      clf__reg_lambda: {log_uniform: [0.001, 10.0]}

# Calibration: fitted on out-of-fold predictions from snapshot A; the method with the
# lowest cross-validated Brier score wins. Methods within `brier_tie_tolerance` of the
# best count as tied, and ties go to the earliest method in `preference`: sigmoid first,
# because it is strictly monotone and keeps every distinction the raw score makes, while
# isotonic is a step function that creates ties (user decision 2026-10-23).
calibration:
  methods: [isotonic, sigmoid]
  preference: [sigmoid, isotonic]
  brier_tie_tolerance: 0.0001
  folds: 5

# Model family selection on snapshot A out-of-fold predictions.
select_by: average_precision

# Contact threshold: searched on this grid step, minimising configs/costs.yaml cost on
# snapshot A's calibrated out-of-fold probabilities.
threshold_grid_step: 0.005

evaluation:
  top_k_pct: [1, 5, 10, 20]
  lift_bins: 10
  calibration_bins: 10

fairness:
  # Demographic features are excluded from the model (decision #36); the audit still
  # reports error rates by these groups on the test snapshot.
  age_band_edges: [10, 20, 25, 30, 35, 40, 50, 91]
  top_cities: 8
  min_group_size: 200

# Re-fit the chosen family with demographics included, to quantify what excluding them
# costs in accuracy (reported, never used for the deployed model).
demographic_ablation: true

mlflow:
  # MLflow 3 rejects the plain-folder store; a local SQLite file is its recommended
  # backend. Both paths are under mlruns/ (gitignored).
  tracking_db: mlruns/mlflow.db
  artifacts_dir: mlruns/artifacts
  experiment: churnlens-phase6

outputs:
  model_dir: models/{mode}
  predictions_dir: data/processed/{mode}/predictions
  tables_dir: reports/model
  figures_dir: reports/figures
  dpi: 150
